name: Generate Changelog

on:
  push:
    branches: [ '**' ]

permissions:
  contents: write

jobs:
  changelog:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: |
          npm install -g conventional-changelog-cli
          npm install -g conventional-changelog-conventionalcommits

      - name: Read gradle.properties
        id: gradle_props
        run: |
          if [ -f "gradle.properties" ]; then
            mod_version=$(grep '^mod_version=' gradle.properties | cut -d'=' -f2 | tr -d ' ')
            game_versions=$(grep '^game_versions=' gradle.properties | cut -d'=' -f2 | tr -d ' ')
            echo "mod_version=$mod_version" >> $GITHUB_OUTPUT
            echo "game_versions=$game_versions" >> $GITHUB_OUTPUT
          else
            echo "gradle.properties not found"
            exit 1
          fi

      - name: Create changelog configuration
        run: |
          cat > .changelogrc.js << 'EOF'
          const config = {
            "writerOpts": {
              "groupBy": "type",
              "commitGroupsSort": function(a, b) {
                // Custom sort to put Features first
                const order = {
                  'Features': 0,
                  'Bug Fixes': 1,
                  'Performance Improvements': 2,
                  'Reverts': 3,
                  'Documentation': 4,
                  'Styles': 5,
                  'Code Refactoring': 6,
                  'Tests': 7,
                  'Build System': 8,
                  'Continuous Integration': 9,
                  'Miscellaneous Chores': 10
                };
                return (order[a.title] || 999) - (order[b.title] || 999);
              }
            },
            "preset": {
              "name": "conventionalcommits",
              "types": [
                {
                  "type": "feat",
                  "section": "Features"
                },
                {
                  "type": "feature",
                  "section": "Features"
                },
                {
                  "type": "fix",
                  "section": "Bug Fixes"
                },
                {
                  "type": "perf",
                  "section": "Performance Improvements"
                },
                {
                  "type": "revert",
                  "section": "Reverts"
                },
                {
                  "type": "docs",
                  "section": "Documentation"
                },
                {
                  "type": "style",
                  "section": "Styles"
                },
                {
                  "type": "chore",
                  "section": "Miscellaneous Chores"
                },
                {
                  "type": "refactor",
                  "section": "Code Refactoring"
                },
                {
                  "type": "test",
                  "section": "Tests"
                },
                {
                  "type": "build",
                  "section": "Build System"
                },
                {
                  "type": "ci",
                  "section": "Continuous Integration"
                }
              ]
            }
          };
          
          module.exports = config;
          EOF

      - name: Check if version exists in CHANGELOG.MD
        id: version_check
        run: |
          version_header="v.${{ steps.gradle_props.outputs.mod_version }} for MC ${{ steps.gradle_props.outputs.game_versions }}"
          if [ -f "CHANGELOG.MD" ] && grep -q "## $version_header" CHANGELOG.MD; then
            echo "version_exists=true" >> $GITHUB_OUTPUT
          else
            echo "version_exists=false" >> $GITHUB_OUTPUT
          fi
          echo "version_header=$version_header" >> $GITHUB_OUTPUT

      - name: Generate temporary changelog
        run: |
          set -eux
          if git describe --tags --exact-match HEAD 2>/dev/null; then
            conventional-changelog -p conventionalcommits -r 1 --config .changelogrc.js > temp_changelog.md
          else
            LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
            TO_TAG="v${{ steps.gradle_props.outputs.mod_version }}"
            echo "LAST_TAG=$LAST_TAG"
            echo "TO_TAG=$TO_TAG"
            conventional-changelog -p conventionalcommits --config .changelogrc.js --from "$LAST_TAG" --to "$TO_TAG" --pkg "{\"version\":\"${{ steps.gradle_props.outputs.mod_version }}\"}" > temp_changelog.md
          fi

      - name: Process changelog content
        run: |
          set -eux
          if [ -s temp_changelog.md ]; then
            if head -1 temp_changelog.md | grep -q "^## "; then
              tail -n +2 temp_changelog.md > temp_content.md
            else
              cp temp_changelog.md temp_content.md
            fi
            sed '/./,$!d' temp_content.md > processed_content.md
          else
            echo "" > processed_content.md
          fi
          # debug quick peek
          echo "---- processed_content.md head ----"
          sed -n '1,120p' processed_content.md || true

      - name: Debug output
        run: |
          echo "=== Debug Information ==="
          echo "Repository status:"
          git status
          echo ""
          echo "Recent commits:"
          git log --oneline -5
          echo ""
          echo "Tags:"
          git tag -l
          echo ""
          echo "Temp changelog content:"
          if [ -f temp_changelog.md ]; then
            echo "--- temp_changelog.md ---"
            cat temp_changelog.md
          else
            echo "temp_changelog.md does not exist"
          fi
          echo ""
          echo "Processed content:"
          if [ -f processed_content.md ]; then
            echo "--- processed_content.md ---"
            cat processed_content.md
          else
            echo "processed_content.md does not exist"
          fi

      - name: Update LATEST_CHANGELOG.MD
        run: |
          set -eux
          version_header="## ${{ steps.version_check.outputs.version_header }}"
          echo "$version_header" > LATEST_CHANGELOG.MD
          echo "" >> LATEST_CHANGELOG.MD
          if [ -s processed_content.md ]; then
            cat processed_content.md >> LATEST_CHANGELOG.MD
          else
            echo "No notable changes." >> LATEST_CHANGELOG.MD
          fi
          ls -la LATEST_CHANGELOG.MD
          sed -n '1,200p' LATEST_CHANGELOG.MD || true

      - name: Update CHANGELOG.MD
        run: |
          set -eux
          version_header="## ${{ steps.version_check.outputs.version_header }}"
          if [ "${{ steps.version_check.outputs.version_exists }}" = "true" ]; then
            if [ -s processed_content.md ]; then
              # replace version block (keep your awk logic)...
              awk -v header="$version_header" -v new_content="$(cat processed_content.md)" '...same as before...' CHANGELOG.MD > temp_changelog_full.md && mv temp_changelog_full.md CHANGELOG.MD
            fi
          else
            if [ -f "CHANGELOG.MD" ]; then
              {
                echo "$version_header"
                echo ""
                if [ -s processed_content.md ]; then
                  cat processed_content.md
                else
                  echo "No notable changes."
                fi
                echo ""
                cat CHANGELOG.MD
              } > temp_changelog_full.md && mv temp_changelog_full.md CHANGELOG.MD
            else
              echo "# Changelog" > CHANGELOG.MD
              echo "" >> CHANGELOG.MD
              echo "$version_header" >> CHANGELOG.MD
              echo "" >> CHANGELOG.MD
              if [ -s processed_content.md ]; then
                cat processed_content.md >> CHANGELOG.MD
              else
                echo "No notable changes." >> CHANGELOG.MD
              fi
            fi
          fi
          ls -la CHANGELOG.MD
          sed -n '1,200p' CHANGELOG.MD || true

      - name: Commit changes
        run: |
          set -eux
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add CHANGELOG.MD LATEST_CHANGELOG.MD || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update changelog for v.${{ steps.gradle_props.outputs.mod_version }}"
            git push
          fi

      - name: Clean up temporary files
        run: |
          rm -f temp_changelog.md temp_content.md processed_content.md .changelogrc.js