name: Update Changelog & Publish

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*.*.*'


permissions:
  contents: write


jobs:
  append-changelog:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/heads/')

    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install changelog generator
        run: npm install -g conventional-changelog-cli

      - name: Get mod version from Gradle
        id: get_version
        run: |
          VERSION=$(./gradlew -q printVersion | tail -n 1)
          echo "mod_version=$VERSION" >> $GITHUB_ENV

      - name: Generate CHANGELOG.md for current version
        run: |
          if [ -z "$latest_tag" ]; then
            conventional-changelog --preset angular > CHANGELOG.md
          else
            conventional-changelog --preset angular --release-count 1 > temp_changelog.md
        
            if [ -f CHANGELOG.md ]; then
              cat temp_changelog.md CHANGELOG.md > full_changelog.md
              mv full_changelog.md CHANGELOG.md
            else
              mv temp_changelog.md CHANGELOG.md
            fi
          fi
          
          #all versions    
          conventional-changelog --preset angular > CHANGELOG_ALL.md

      - name: Commit & Push CHANGELOG.md
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md CHANGELOG_FULL.md
          git diff --cached --quiet || git commit -m "chore: update changelogs"
          git push origin HEAD:${{ github.ref_name }}

      - name: Tag last release
        if: github.event_name == 'push' && github.ref_type == 'branch'
        run: |
          NEW_TAG=${{ env.mod_version }}
          git tag v.${NEW_TAG}
          git push origin v.${NEW_TAG}


  publish:
    needs: append-changelog
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup Java 21
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 21

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Publish to Modrinth
        run: ./gradlew modrinth --no-daemon
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}

      - name: Publish to CurseForge
        run: ./gradlew publishCurseForge --no-daemon
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}