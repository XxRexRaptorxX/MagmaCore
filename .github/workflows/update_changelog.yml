name: Update Changelog

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  update-changelog:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/heads/')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install conventional-changelog
        run: npm install -g conventional-changelog-cli

      - name: Extract version from gradle.properties
        id: extract_version
        run: |
          RAW=$(grep '^mod_version=' gradle.properties | cut -d'=' -f2 | tr -d '[:space:]')
          VERSION=${RAW/-SNAPSHOT/}
          echo "mod_version=$VERSION" >> $GITHUB_ENV
          echo "Extracted version: $VERSION"

      - name: Generate full CHANGELOG.md
        run: |
          # vollständige History aller Releases
          conventional-changelog --preset angular --output CHANGELOG.md
          # Header nur mit Version (kein Datum)
          sed -i "1s/^/## v${{ env.mod_version }}\n\n/" CHANGELOG.md


      - name: Debug git status
        run: |
          git status
          git diff
          git diff --cached

      - name: Commit & Push CHANGELOG.md
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add CHANGELOG.md
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update CHANGELOG.md"
            git push origin HEAD:${{ github.ref_name }}
          fi
          

  publish:
    needs: update-changelog
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup Java 21
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 21

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Publish to Modrinth
        run: ./gradlew modrinth --no-daemon
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}

      - name: Publish to CurseForge
        run: ./gradlew publishCurseForge --no-daemon
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}