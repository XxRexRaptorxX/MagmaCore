# English comments inside file as requested
name: Update changelogs

on:
  push:
    # run on pushes to any branch; you can restrict to main if you want
    branches: ['**']

permissions:
  contents: write

jobs:
  update-changelog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # we need full history for git log ranges
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Run changelog updater
        # this step runs the script that computes and updates the changelogs
        env:
          # range boundaries from GitHub event context
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF: ${{ github.ref }}
        run: |
          node .github/scripts/update-changelog.js
