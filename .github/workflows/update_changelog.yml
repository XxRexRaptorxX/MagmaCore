name: Update Changelog

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  update-changelog:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/heads/')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install conventional-changelog
        run: npm install -g conventional-changelog-cli

      - name: Read versions from gradle.properties
        id: read_versions
        run: |
          MOD_VERSION=$(grep "^mod_version=" gradle.properties | cut -d'=' -f2)
          MC_VERSION=$(grep "^minecraft_version=" gradle.properties | cut -d'=' -f2)
          echo "mod_version=$MOD_VERSION" >> $GITHUB_ENV
          echo "mc_version=$MC_VERSION" >> $GITHUB_ENV

      - name: Generate latest changelog
        run: |
          git fetch --tags
          conventional-changelog --preset angular --release-count 1 > CHANGELOG_LATEST_TEMP.md

      - name: Create CHANGELOG_LATEST.md with header
        run: |
          VERSION=${{ env.mod_version }}
          MC_VERSION=${{ env.mc_version }}
          DATE=$(date +'%d.%m.%Y')
          VERSION_HEADER="# v.${VERSION} for MC ${MC_VERSION} – ${DATE}"
          
          # Create new CHANGELOG_LATEST.md with header
          echo "${VERSION_HEADER}" > CHANGELOG_LATEST.md
          echo "" >> CHANGELOG_LATEST.md
          
          # Add generated changelog content (skip empty lines at start)
          tail -n +1 CHANGELOG_LATEST_TEMP.md | sed '/^$/d;q;:a;N;s/\n$//;ta' >> CHANGELOG_LATEST.md
          
          # Clean up temp file
          rm -f CHANGELOG_LATEST_TEMP.md

      - name: Update main changelog (prepend new version)
        run: |
          VERSION=${{ env.mod_version }}
          MC_VERSION=${{ env.mc_version }}
          DATE=$(date +'%d.%m.%Y')
          VERSION_HEADER="# v.${VERSION} for MC ${MC_VERSION} – ${DATE}"

          # Check if version already exists in CHANGELOG.md
          if [ -f "CHANGELOG.md" ] && grep -q "^# v\.${VERSION} for MC ${MC_VERSION}" CHANGELOG.md; then
            echo "Version ${VERSION} for MC ${MC_VERSION} already exists in CHANGELOG.md, skipping update"
            exit 0
          fi

          # Backup existing changelog
          if [ -f "CHANGELOG.md" ]; then
            cp CHANGELOG.md CHANGELOG_OLD.md
          else
            touch CHANGELOG_OLD.md
          fi

          # Create new changelog with latest version at top
          cp CHANGELOG_LATEST.md CHANGELOG.md

          # Add separator and old changelog content if it exists and is not empty
          if [ -s CHANGELOG_OLD.md ]; then
            echo "" >> CHANGELOG.md
            echo "" >> CHANGELOG.md
            cat CHANGELOG_OLD.md >> CHANGELOG.md
          fi

          # Cleanup
          rm -f CHANGELOG_OLD.md

          echo "Added new version ${VERSION} to CHANGELOG.md"

      - name: Remove compare link lines from changelogs
        run: |
          # Remove compare links and empty lines at the beginning
          sed -i '/^# \[\](.*compare.*)/d' CHANGELOG.md || true
          sed -i '/^# \[\](.*compare.*)/d' CHANGELOG_LATEST.md || true
          
          # Remove multiple consecutive empty lines
          sed -i '/^$/N;/^\n$/d' CHANGELOG.md || true
          sed -i '/^$/N;/^\n$/d' CHANGELOG_LATEST.md || true

      - name: Commit & push changelogs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Check if changelogs have changes
          CHANGES_MADE=false
          if ! git diff --quiet CHANGELOG.md 2>/dev/null; then
            echo "Changes detected in CHANGELOG.md"
            CHANGES_MADE=true
          else
            echo "No changes to CHANGELOG.md"
          fi
          
          if ! git diff --quiet CHANGELOG_LATEST.md 2>/dev/null; then
            echo "Changes detected in CHANGELOG_LATEST.md"
            CHANGES_MADE=true
          else
            echo "No changes to CHANGELOG_LATEST.md"
          fi
          
          if [ "$CHANGES_MADE" = true ]; then
            git add CHANGELOG.md CHANGELOG_LATEST.md
            git commit -m "chore: update changelogs for v${{ env.mod_version }}"
            git push origin HEAD:${{ github.ref_name }}
            echo "Changelogs updated and pushed"
          else
            echo "No changelog changes to commit"
          fi
          
          # Create tag if not existing
          if ! git rev-parse v${{ env.mod_version }} >/dev/null 2>&1; then
            git tag v${{ env.mod_version }}
            git push origin v${{ env.mod_version }}
            echo "Created and pushed tag v${{ env.mod_version }}"
          else
            echo "Tag v${{ env.mod_version }} already exists, skipping tag creation"
          fi