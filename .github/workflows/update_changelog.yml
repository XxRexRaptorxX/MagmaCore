name: Update Changelog

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  update-changelog:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/heads/')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Check for accidentally committed secrets
        run: |
          echo "Scanning last commit for secrets..."
          BAD_PATTERNS=(
            'ghp_[A-Za-z0-9]{36}'         # GitHub PAT
            '[A-Za-z0-9_\-]{20,}'         # allgemein lange Tokens
            'eyJ[A-Za-z0-9_\-]{10,}'      # JWT Tokens
          )
          
          git show HEAD --unified=0 | grep -E '^\+' | grep -v '^+++ ' > .diff_lines.txt
      
          FOUND=0
          for PATTERN in "${BAD_PATTERNS[@]}"; do
          echo "Checking for pattern: $PATTERN"
          MATCHES=$(grep -En "$PATTERN" .diff_lines.txt || true)
          if [ -n "$MATCHES" ]; then
          echo "Potential secret detected:"
          echo "$MATCHES"
          FOUND=1
          fi
          done
      
          if [ "$FOUND" -eq 1 ]; then
          echo "::error title=Secret detected::One or more lines appear to contain a secret/token. Please remove them immediately!"
          exit 1
          fi

          echo "No secrets found in last commit."

      - name: Install conventional-changelog
        run: npm install -g conventional-changelog-cli

      - name: Read versions from gradle.properties
        id: read_versions
        run: |
          MOD_VERSION=$(grep "^mod_version=" gradle.properties | cut -d'=' -f2)
          MC_VERSION=$(grep "^minecraft_version=" gradle.properties | cut -d'=' -f2)
          echo "mod_version=$MOD_VERSION" >> $GITHUB_ENV
          echo "mc_version=$MC_VERSION" >> $GITHUB_ENV

      - name: Generate full changelog (all versions)
        run: |
          git fetch --tags
          conventional-changelog --preset angular > CHANGELOG.md

      - name: Generate latest changelog
        run: |
          git fetch --tags
          conventional-changelog --preset angular --release-count 1 > CHANGELOG_LATEST.md

      - name: Add header with version and MC version to CHANGELOG.md
        run: |
          VERSION=${{ env.mod_version }}
          MC_VERSION=${{ env.mc_version }}
          DATE=$(date +'%d.%m.%Y')
          sed -i "1s/^/# v.${VERSION} for MC ${MC_VERSION} – ${DATE}\n/" CHANGELOG.md

      - name: Add header with version and MC version to CHANGELOG_LATEST.md
        run: |
          VERSION=${{ env.mod_version }}
          MC_VERSION=${{ env.mc_version }}
          DATE=$(date +'%d.%m.%Y')
          sed -i "1s/^/# v.${VERSION} for MC ${MC_VERSION} – ${DATE}\n/" CHANGELOG_LATEST.md

      - name: Remove compare link line from changelogs
        run: |
          sed -i '/^# \[\](.*compare.*)/d' CHANGELOG.md
          sed -i '/^# \[\](.*compare.*)/d' CHANGELOG_LATEST.md

      - name: Commit & push changelogs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md CHANGELOG_LATEST.md
          git diff --cached --quiet || git commit -m "chore: update changelogs"
          git push origin HEAD:${{ github.ref_name }}
          
          git tag v${{ env.mod_version }}
          git push origin v${{ env.mod_version }}

   

  publish:
    needs: update-changelog
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup Java 21
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 21

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Publish to Modrinth
        run: ./gradlew modrinth --no-daemon
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}

      - name: Publish to CurseForge
        run: ./gradlew publishCurseForge --no-daemon
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}