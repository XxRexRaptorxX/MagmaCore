name: Update Changelog & Publish

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  append-changelog:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/heads/')

    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Setup Java 21
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 21

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Install changelog generator
        run: npm install -g conventional-changelog-cli

      # DEBUG: Zeige gradle.properties Inhalt
      - name: Debug - Show gradle.properties
        run: |
          echo "=== gradle.properties content ==="
          cat gradle.properties
          echo "=========================="

      # Verbesserte Version-Extraktion mit Debug-Output
      - name: Get version from gradle.properties with debug
        id: get_version
        run: |
          echo "=== Extracting version ==="
          
          # Zeige verfügbare mod_version Zeilen
          echo "Lines containing 'mod_version':"
          grep -n 'mod_version' gradle.properties || echo "No mod_version found"
          
          # Extrahiere Version mit verschiedenen Methoden
          MOD_VERSION1=$(grep '^mod_version=' gradle.properties | cut -d'=' -f2 | tr -d ' \t\r\n' | head -1)
          MOD_VERSION2=$(awk -F'=' '/^mod_version=/ {gsub(/^[ \t]*|[ \t]*$/, "", $2); print $2}' gradle.properties | head -1)
          
          echo "Method 1 result: '$MOD_VERSION1'"
          echo "Method 2 result: '$MOD_VERSION2'"
          
          # Verwende die erste nicht-leere Version
          if [ -n "$MOD_VERSION1" ]; then
            FINAL_VERSION="$MOD_VERSION1"
          elif [ -n "$MOD_VERSION2" ]; then
            FINAL_VERSION="$MOD_VERSION2"
          else
            echo "ERROR: Could not extract version!"
            exit 1
          fi
          
          echo "final_version=$FINAL_VERSION" >> $GITHUB_ENV
          echo "Final version: '$FINAL_VERSION'"
          
          # Validierung
          if [ -z "$FINAL_VERSION" ]; then
            echo "ERROR: Version is empty!"
            exit 1
          fi

      - name: Get latest tag
        id: get_latest_tag
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          echo "latest_tag=$LATEST_TAG" >> $GITHUB_ENV
          echo "Latest tag: '$LATEST_TAG'"

      # Erstelle package.json mit expliziter Debug-Ausgabe
      - name: Create package.json with debug
        run: |
          echo "=== Creating package.json ==="
          echo "Using version: '${{ env.final_version }}'"
          
          cat > package.json << EOF
          {
            "name": "${{ github.event.repository.name }}",
            "version": "${{ env.final_version }}",
            "repository": {
              "type": "git",
              "url": "https://github.com/${{ github.repository }}.git"
            }
          }
          EOF
          
          echo "=== package.json created ==="
          cat package.json
          echo "=========================="
          
          # Validiere JSON
          node -e "console.log('JSON is valid:', JSON.parse(require('fs').readFileSync('package.json', 'utf8')))"

      - name: Generate CHANGELOG.md with manual version handling
        run: |
          echo "=== Generating changelog ==="
          echo "Version: '${{ env.final_version }}'"
          echo "Latest tag: '${{ env.latest_tag }}'"
          
          # Erstelle temporären Changelog ohne Version-Header
          if [ -z "${{ env.latest_tag }}" ]; then
            echo "No previous tag - generating full changelog"
            conventional-changelog --preset angular --pkg package.json --release-count 0 > temp_raw_changelog.md
          else
            echo "Previous tag found - generating since last tag"
            conventional-changelog --preset angular --pkg package.json --release-count 1 > temp_raw_changelog.md
          fi
          
          echo "=== Raw changelog content ==="
          head -10 temp_raw_changelog.md
          echo "=========================="
          
          # Erstelle finalen Changelog mit manueller Version
          {
            echo "## [${{ env.final_version }}] ($(date '+%Y-%m-%d'))"
            echo ""
          
            # Entferne leere Header aus conventional-changelog
            grep -v '^## \[\]' temp_raw_changelog.md | grep -v '^# $' | grep -v '^##  (' || cat temp_raw_changelog.md
          
          } > new_changelog.md
          
          # Kombiniere mit existierendem Changelog
          if [ -f CHANGELOG.md ]; then
            echo "Combining with existing changelog"
            cat new_changelog.md CHANGELOG.md > combined_changelog.md
            mv combined_changelog.md CHANGELOG.md
          else
            echo "Creating new changelog"
            mv new_changelog.md CHANGELOG.md
          fi
          
          # Erstelle CHANGELOG_FULL.md
          echo "=== Creating full changelog ==="
          {
            echo "# Changelog"
            echo ""
            echo "All notable changes to this project will be documented in this file."
            echo ""
            cat CHANGELOG.md
          } > CHANGELOG_FULL.md

      - name: Show final results
        run: |
          echo "=== Environment Variables ==="
          echo "final_version: '${{ env.final_version }}'"
          echo "latest_tag: '${{ env.latest_tag }}'"
          echo ""
          echo "=== Final CHANGELOG.md (first 25 lines) ==="
          head -25 CHANGELOG.md
          echo ""
          echo "=== Final CHANGELOG_FULL.md (first 25 lines) ==="
          head -25 CHANGELOG_FULL.md

      - name: Commit & Push CHANGELOG.md
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md CHANGELOG_FULL.md
          
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update changelogs for v${{ env.final_version }} [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
            echo "Changes committed and pushed"
          fi

      - name: Tag last release
        if: github.event_name == 'push' && github.ref_type == 'branch'
        run: |
          NEW_TAG="v${{ env.final_version }}"
          echo "Checking tag: $NEW_TAG"
          
          if git rev-parse "$NEW_TAG" >/dev/null 2>&1; then
            echo "Tag $NEW_TAG already exists"
          else
            git tag "$NEW_TAG"
            git push origin "$NEW_TAG"
            echo "Created and pushed tag: $NEW_TAG"
          fi

  publish:
    needs: append-changelog
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup Java 21
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 21

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Publish to Modrinth
        run: ./gradlew modrinth --no-daemon
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}

      - name: Publish to CurseForge
        run: ./gradlew publishCurseForge --no-daemon
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}