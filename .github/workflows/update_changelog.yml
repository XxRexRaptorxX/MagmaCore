name: Update Changelog

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  update-changelog:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/heads/')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install conventional-changelog
        run: npm install -g conventional-changelog-cli

      - name: Read versions from gradle.properties
        id: read_versions
        run: |
          MOD_VERSION=$(grep "^mod_version=" gradle.properties | cut -d'=' -f2)
          MC_VERSION=$(grep "^minecraft_version=" gradle.properties | cut -d'=' -f2)
          echo "mod_version=$MOD_VERSION" >> $GITHUB_ENV
          echo "mc_version=$MC_VERSION" >> $GITHUB_ENV

      - name: Check if version exists and get last commit
        id: version_check
        run: |
          VERSION=${{ env.mod_version }}
          MC_VERSION=${{ env.mc_version }}
          
          if [ -f "CHANGELOG.md" ] && grep -q "^# v\.${VERSION} for MC ${MC_VERSION}" CHANGELOG.md; then
            echo "version_exists=true" >> $GITHUB_ENV
            # Get the commit hash of the last tag for this version
            LAST_TAG_COMMIT=$(git rev-list -n 1 "v${VERSION}" 2>/dev/null || echo "")
            CURRENT_COMMIT=$(git rev-parse HEAD)
            echo "last_tag_commit=$LAST_TAG_COMMIT" >> $GITHUB_ENV
            echo "current_commit=$CURRENT_COMMIT" >> $GITHUB_ENV
          
            if [ "$LAST_TAG_COMMIT" != "$CURRENT_COMMIT" ]; then
              echo "has_new_commits=true" >> $GITHUB_ENV
              echo "Version ${VERSION} exists but has new commits since last tag"
            else
              echo "has_new_commits=false" >> $GITHUB_ENV
              echo "Version ${VERSION} exists and no new commits found"
            fi
          else
            echo "version_exists=false" >> $GITHUB_ENV
            echo "has_new_commits=true" >> $GITHUB_ENV
            echo "Version ${VERSION} does not exist in changelog"
          fi

      - name: Generate and sort changelog
        if: env.has_new_commits == 'true'
        run: |
          VERSION=${{ env.mod_version }}
          MC_VERSION=${{ env.mc_version }}
          DATE=$(date +'%d.%m.%Y')
          CUSTOM_HEADER="# v.${VERSION} for MC ${MC_VERSION} — ${DATE}"
          
          # Generate changelog from commits since last tag (if version exists) or all recent commits
          if [ "${{ env.version_exists }}" = "true" ] && [ -n "${{ env.last_tag_commit }}" ]; then
            # Generate changelog since last tag
            conventional-changelog --preset angular --release-count 0 --commit-range "${{ env.last_tag_commit }}..HEAD" > CHANGELOG_RAW.md
          else
            # Generate changelog for latest release
            conventional-changelog --preset angular --release-count 1 > CHANGELOG_RAW.md
          fi
          
          # Process and restructure the changelog using Python
          if [ -s CHANGELOG_RAW.md ]; then
            # Pass variables as environment variables to Python
            export CHANGELOG_VERSION="$VERSION"
            export CHANGELOG_MC_VERSION="$MC_VERSION" 
            export CHANGELOG_DATE="$DATE"
          
            python3 << 'EOF'
          import re
          import sys
          import os
          
          # Read the raw changelog
          with open('CHANGELOG_RAW.md', 'r', encoding='utf-8') as f:
              content = f.read()
          
          # Get variables from environment
          version = os.environ.get('CHANGELOG_VERSION', '1.0.0')
          mc_version = os.environ.get('CHANGELOG_MC_VERSION', '1.21')
          date = os.environ.get('CHANGELOG_DATE', '01.01.2025')
          
          # Custom header
          custom_header = f"# v.{version} for MC {mc_version} — {date}"
          
          # Remove the original header if it exists (starts with ## [version] or # version)
          lines = content.split('\n')
          if lines and (lines[0].startswith('## [') or lines[0].startswith('# ')):
              content = '\n'.join(lines[1:])
          
          # Parse sections
          sections = {}
          current_section = None
          current_content = []
          
          for line in content.split('\n'):
              if line.startswith('### '):
                  # Save previous section
                  if current_section:
                      sections[current_section] = '\n'.join(current_content).strip()
                  # Start new section
                  current_section = line[4:].strip()  # Remove "### "
                  current_content = [line]
              elif current_section:
                  current_content.append(line)
          
          # Save last section
          if current_section:
              sections[current_section] = '\n'.join(current_content).strip()
          
          # Define section order (Features first, then alphabetical)
          section_order = []
          if 'Features' in sections:
              section_order.append('Features')
          
          # Add other sections alphabetically
          other_sections = sorted([s for s in sections.keys() if s != 'Features'])
          section_order.extend(other_sections)
          
          # Build final changelog
          result = [custom_header, '']
          
          for section_name in section_order:
              if section_name in sections and sections[section_name].strip():
                  result.append(sections[section_name])
                  result.append('')  # Empty line between sections
          
          # Remove trailing empty lines
          while result and result[-1] == '':
              result.pop()
          
          # Write result
          with open('CHANGELOG_LATEST.md', 'w', encoding='utf-8') as f:
              f.write('\n'.join(result) + '\n')
          
          print(f"Processed changelog with sections: {', '.join(section_order)}")
          EOF
          
          # Clean up temp files
          rm -f CHANGELOG_RAW.md
          else
            # Fallback - create basic changelog
            echo "${CUSTOM_HEADER}" > CHANGELOG_LATEST.md
            echo "" >> CHANGELOG_LATEST.md
            echo "### Features" >> CHANGELOG_LATEST.md
            echo "" >> CHANGELOG_LATEST.md
            echo "* Release version ${VERSION}" >> CHANGELOG_LATEST.md
            echo "" >> CHANGELOG_LATEST.md
          fi

      - name: Update main changelog
        if: env.has_new_commits == 'true'
        run: |
          VERSION=${{ env.mod_version }}
          MC_VERSION=${{ env.mc_version }}
          
          if [ "${{ env.version_exists }}" = "true" ]; then
            # Replace existing version entry
            echo "Updating existing version ${VERSION} in changelog"
          
            # Find the line number of the version to replace
            VERSION_LINE=$(grep -n "^# v\.${VERSION} for MC ${MC_VERSION}" CHANGELOG.md | head -1 | cut -d: -f1)
          
            if [ -n "$VERSION_LINE" ]; then
              # Get content before this version
              if [ "$VERSION_LINE" -gt 1 ]; then
                head -n $((VERSION_LINE - 1)) CHANGELOG.md > CHANGELOG_BEFORE.tmp
              else
                touch CHANGELOG_BEFORE.tmp
              fi
          
              # Find the next version header to determine where current version ends
              NEXT_VERSION_LINE=$(tail -n +$((VERSION_LINE + 1)) CHANGELOG.md | grep -n "^# v\." | head -1 | cut -d: -f1)
              if [ -n "$NEXT_VERSION_LINE" ]; then
                # There is a next version, get content after current version
                tail -n +$((VERSION_LINE + NEXT_VERSION_LINE)) CHANGELOG.md > CHANGELOG_AFTER.tmp
              else
                # No next version, current version goes to end of file
                touch CHANGELOG_AFTER.tmp
              fi
          
              # Combine: before + new version + after
              cat CHANGELOG_BEFORE.tmp > CHANGELOG.md
              if [ -s CHANGELOG_BEFORE.tmp ]; then
                echo "" >> CHANGELOG.md
              fi
              cat CHANGELOG_LATEST.md >> CHANGELOG.md
              if [ -s CHANGELOG_AFTER.tmp ]; then
                echo "" >> CHANGELOG.md
                cat CHANGELOG_AFTER.tmp >> CHANGELOG.md
              fi
          
              rm -f CHANGELOG_BEFORE.tmp CHANGELOG_AFTER.tmp
            else
              # Version not found, add at top (fallback)
              cp CHANGELOG.md CHANGELOG_OLD.tmp
              cp CHANGELOG_LATEST.md CHANGELOG.md
              echo "" >> CHANGELOG.md
              cat CHANGELOG_OLD.tmp >> CHANGELOG.md
              rm -f CHANGELOG_OLD.tmp
            fi
          else
            # Add new version at top
            if [ -f "CHANGELOG.md" ]; then
              cp CHANGELOG.md CHANGELOG_OLD.tmp
            else
              touch CHANGELOG_OLD.tmp
            fi
          
            cp CHANGELOG_LATEST.md CHANGELOG.md
          
            if [ -s CHANGELOG_OLD.tmp ]; then
              echo "" >> CHANGELOG.md
              echo "" >> CHANGELOG.md
              cat CHANGELOG_OLD.tmp >> CHANGELOG.md
            fi
          
            rm -f CHANGELOG_OLD.tmp
          fi
          
          echo "Updated changelog for version ${VERSION}"

      - name: Clean up excessive empty lines only
        if: env.has_new_commits == 'true'
        run: |
          for file in CHANGELOG.md CHANGELOG_LATEST.md; do
            if [ -f "$file" ]; then
              awk 'BEGIN{blank=0} /^$/{blank++; if(blank<=2) print} !/^$/{blank=0; print}' "$file" > "${file}.tmp" && mv "${file}.tmp" "$file"
            fi
          done

      - name: Commit & push changelogs
        if: env.has_new_commits == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Check if changelogs have changes
          CHANGES_MADE=false
          if ! git diff --quiet CHANGELOG.md 2>/dev/null; then
            echo "Changes detected in CHANGELOG.md"
            CHANGES_MADE=true
          else
            echo "No changes to CHANGELOG.md"
          fi
          
          if ! git diff --quiet CHANGELOG_LATEST.md 2>/dev/null; then
            echo "Changes detected in CHANGELOG_LATEST.md"
            CHANGES_MADE=true
          else
            echo "No changes to CHANGELOG_LATEST.md"
          fi
          
          if [ "$CHANGES_MADE" = true ]; then
            git add CHANGELOG.md CHANGELOG_LATEST.md
          
            if [ "${{ env.version_exists }}" = "true" ]; then
              git commit -m "chore: update changelog for existing v${{ env.mod_version }} with new commits"
            else
              git commit -m "chore: update changelogs for v${{ env.mod_version }}"
            fi
          
            git push origin HEAD:${{ github.ref_name }}
            echo "Changelogs updated and pushed"
          else
            echo "No changelog changes to commit"
          fi
          
          # Update or create tag
          if git rev-parse v${{ env.mod_version }} >/dev/null 2>&1; then
            # Tag exists, update it to point to current commit
            git tag -f v${{ env.mod_version }}
            git push -f origin v${{ env.mod_version }}
            echo "Updated tag v${{ env.mod_version }} to current commit"
          else
            # Create new tag
            git tag v${{ env.mod_version }}
            git push origin v${{ env.mod_version }}
            echo "Created and pushed tag v${{ env.mod_version }}"
          fi