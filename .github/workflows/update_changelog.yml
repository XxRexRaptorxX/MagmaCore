name: Update Changelog

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  update-changelog:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/heads/')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install conventional-changelog
        run: npm install -g conventional-changelog-cli

      - name: Read versions from gradle.properties
        id: read_versions
        run: |
          MOD_VERSION=$(grep "^mod_version=" gradle.properties | cut -d'=' -f2)
          MC_VERSION=$(grep "^minecraft_version=" gradle.properties | cut -d'=' -f2)
          echo "mod_version=$MOD_VERSION" >> $GITHUB_ENV
          echo "mc_version=$MC_VERSION" >> $GITHUB_ENV

      - name: Update full changelog (prepend new version)
        run: |
          VERSION=${{ env.mod_version }}
          MC_VERSION=${{ env.mc_version }}
          DATE=$(date +'%d.%m.%Y')
          VERSION_HEADER="# v.${VERSION} for MC ${MC_VERSION} – ${DATE}"

          # checks if version already exists
          if [ -f "CHANGELOG.md" ] && grep -q "^# v\.${VERSION} for MC ${MC_VERSION}" CHANGELOG.md; then
            echo "Version ${VERSION} for MC ${MC_VERSION} already exists in CHANGELOG.md, skipping update"
            # Trotzdem CHANGELOG_LATEST.md aktualisieren für andere Zwecke
            exit 0
          fi

          # backup existing changelog
          if [ -f "CHANGELOG.md" ]; then
            cp CHANGELOG.md CHANGELOG_OLD.md
          else
            touch CHANGELOG_OLD.md
          fi

          # create new changelog with latest version at top
          echo "${VERSION_HEADER}" > CHANGELOG.md
          echo "" >> CHANGELOG.md

          # add latest changelog content (without the header we already added)
          tail -n +2 CHANGELOG_LATEST.md >> CHANGELOG.md

          # add separator and old changelog content
          if [ -s CHANGELOG_OLD.md ]; then
            echo "" >> CHANGELOG.md
            echo "" >> CHANGELOG.md
            cat CHANGELOG_OLD.md >> CHANGELOG.md
          fi

          # Cleanup
          rm -f CHANGELOG_OLD.md

          echo "Added new version ${VERSION} to CHANGELOG.md"

      - name: Generate latest changelog
        run: |
          git fetch --tags
          conventional-changelog --preset angular --release-count 1 > CHANGELOG_LATEST.md

      - name: Add header with version and MC version to CHANGELOG.md
        run: |
          VERSION=${{ env.mod_version }}
          MC_VERSION=${{ env.mc_version }}
          DATE=$(date +'%d.%m.%Y')
          sed -i "1s/^/# v.${VERSION} for MC ${MC_VERSION} – ${DATE}\n/" CHANGELOG.md

      - name: Add header with version and MC version to CHANGELOG_LATEST.md
        run: |
          VERSION=${{ env.mod_version }}
          MC_VERSION=${{ env.mc_version }}
          DATE=$(date +'%d.%m.%Y')
          sed -i "1s/^/# v.${VERSION} for MC ${MC_VERSION} – ${DATE}\n/" CHANGELOG_LATEST.md

      - name: Remove compare link line from changelogs
        run: |
          sed -i '/^# \[\](.*compare.*)/d' CHANGELOG.md
          sed -i '/^# \[\](.*compare.*)/d' CHANGELOG_LATEST.md

      - name: Commit & push changelogs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # check if changelogs are changed
          CHANGES_MADE=false
          if git diff --quiet CHANGELOG.md; then
            echo "No changes to CHANGELOG.md"
          else
            echo "Changes detected in CHANGELOG.md"
            CHANGES_MADE=true
          fi
          
          if git diff --quiet CHANGELOG_LATEST.md; then
            echo "No changes to CHANGELOG_LATEST.md"
          else
            echo "Changes detected in CHANGELOG_LATEST.md"
            CHANGES_MADE=true
          fi
          
          if [ "$CHANGES_MADE" = true ]; then
            git add CHANGELOG.md CHANGELOG_LATEST.md
            git commit -m "chore: update changelogs"
            git push origin HEAD:${{ github.ref_name }}
            echo "Changelogs updated and pushed"
          else
            echo "No changelog changes to commit"
          fi
          
          # create tag if not existing
          if ! git rev-parse v${{ env.mod_version }} >/dev/null 2>&1; then
            git tag v${{ env.mod_version }}
            git push origin v${{ env.mod_version }}
            echo "Created and pushed tag v${{ env.mod_version }}"
          else
            echo "Tag v${{ env.mod_version }} already exists, skipping tag creation"
          fi

   

  publish:
    needs: update-changelog
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup Java 21
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 21

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Read versions from gradle.properties
        id: read_versions
        run: |
          MOD_VERSION=$(grep "^mod_version=" gradle.properties | cut -d'=' -f2)
          MC_VERSION=$(grep "^minecraft_version=" gradle.properties | cut -d'=' -f2)
          echo "mod_version=$MOD_VERSION" >> $GITHUB_ENV
          echo "mc_version=$MC_VERSION" >> $GITHUB_ENV

      - name: Publish to Modrinth
        run: ./gradlew modrinth --no-daemon
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}

      - name: Publish to CurseForge
        run: ./gradlew publishCurseForge --no-daemon
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}



  update-version-file:
    needs: publish
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read versions from gradle.properties
        id: read_versions
        run: |
          MOD_VERSION=$(grep "^mod_version=" gradle.properties | cut -d'=' -f2)
          MC_VERSION=$(grep "^minecraft_version=" gradle.properties | cut -d'=' -f2)
          echo "mod_version=$MOD_VERSION" >> $GITHUB_ENV
          echo "mc_version=$MC_VERSION" >> $GITHUB_ENV
          echo "Mod Version: $MOD_VERSION"
          echo "MC Version: $MC_VERSION"

      - name: Install jq for JSON processing
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Get all branches
        run: |
          git fetch --all
          git branch -r --format='%(refname:short)' | grep -v 'HEAD' | sed 's/origin\///' > branches.txt
          echo "Found branches:"
          cat branches.txt

      - name: Update version file in all branches
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          VERSION=${{ env.mod_version }}
          MC_VERSION=${{ env.mc_version }}
          UPDATE_FILE="update.json"

          # interate through all branches
          while IFS= read -r branch; do
            echo "Processing branch: $branch"

            git checkout "$branch" || {
              echo "Failed to checkout $branch, skipping..."
              continue
            }

            # check for update.json, if not, generate it
            if [ ! -f "$UPDATE_FILE" ]; then
              echo '{
                "homepage": "https://www.curseforge.com/members/xxrexraptorxx/projects",
                "promos": {}
              }' > "$UPDATE_FILE"
            fi

            # version change
            jq --arg mc_version "$MC_VERSION" --arg mod_version "$VERSION" '
              .promos[($mc_version + "-latest")] = $mod_version |
              .promos[($mc_version + "-recommended")] = $mod_version
            ' "$UPDATE_FILE" > temp.json && mv temp.json "$UPDATE_FILE"

            # check if file was changed
            if git diff --quiet "$UPDATE_FILE"; then
              echo "No changes to version file in branch $branch"
            else
              git add "$UPDATE_FILE"
              git commit -m "chore: update version file for MC $MC_VERSION v$VERSION"
              git push origin "$branch"
              echo "Version file updated and pushed to branch $branch"
            fi

          done < branches.txt

          echo "Version file update completed for all branches"