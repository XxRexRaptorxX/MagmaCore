import net.darkhax.curseforgegradle.TaskPublishCurseForge

plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.78'
    id 'idea'
    id 'com.modrinth.minotaur' version '2.+'
    id 'net.darkhax.curseforgegradle' version '1.1.26'
    id 'com.diffplug.spotless' version '6.25.0'
}

// ========================================
// PROJECT CONFIGURATION
// ========================================

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(java_version)

// ========================================
// GRADLE WRAPPER CONFIGURATION
// ========================================

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

// ========================================
// NEOFORGE CONFIGURATION
// ========================================

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        client {
            client()
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            // This run config launches GameTestServer and runs all registered gametests, then exits.
            // By default, the server will crash when no gametests are provided.
            // The gametest system is also enabled by default for other run configs under the /test command.
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            clientData()
            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all',
                '--output', file('src/generated/resources/').getAbsolutePath(),
                                '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// ========================================
// SOURCE SETS & DEPENDENCIES
// ========================================

// Include resources generated by data generators.
sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

repositories {
    mavenLocal()

    maven { // JEI
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }

    maven { // JEI fallback
        name = "ModMaven"
        url = "https://modmaven.dev"
    }

    maven { // Curseforge
        url "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }

    maven { // REI
        url "https://maven.shedaniel.me/"
    }

    maven { // EMI
        name = "TerraformersMC"
        url = "https://maven.terraformersmc.com/"
    }

    maven { // Curios
        name = "Illusive Soulworks maven"
        url = "https://maven.theillusivec4.top/"
    }
}

dependencies {
    // JEI
    compileOnly("mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}")

    // REI
    compileOnly "me.shedaniel:RoughlyEnoughItems-api-neoforge:${rei_version}"
    compileOnly "me.shedaniel:RoughlyEnoughItems-default-plugin-neoforge:${rei_version}"
    runtimeOnly "me.shedaniel:RoughlyEnoughItems-neoforge:${rei_version}"

    // EMI
    compileOnly "dev.emi:emi-neoforge:${emi_version}:api"

    // JADE
    runtimeOnly "curse.maven:jade-324717:${jade_version}"
}

// ========================================
// MOD METADATA GENERATION
// ========================================

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            pack_format_number     : pack_format_number,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

// ========================================
// BUILD & FORMATTING
// ========================================

tasks.named('jar').configure {
    archiveBaseName.set(mod_name.replace(" ", ""))
    archiveVersion.set("${minecraft_version}-(v.${mod_version}-${mod_loader})")
}

spotless {
    java {
        target 'src/**/*.java'
        palantirJavaFormat()
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
    }
    json {
        target 'src/**/*.json'
        gson().indentWithSpaces(2)
        endWithNewline()
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// ========================================
// IDE CONFIGURATION
// ========================================

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// ========================================
// MAVEN PUBLISHING
// ========================================

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

// ========================================
// CHANGELOG UTILITIES
// ========================================

def generateLatestChangelog() {
    def changelogFile = file("CHANGELOG_LATEST.md")

    if (changelogFile.exists()) {
        def content = changelogFile.text.trim()
        def lines = content.split('\n')
        if (lines.length > 1) {
            return lines[1..-1].join('\n').trim()
        }
        return content
    }

    // Fallback: Git-based generation
    println "CHANGELOG_LATEST.md not found, generating from git..."
    def proc = "git describe --tags --abbrev=0".execute()
    def lastTag = proc.text.trim()
    if (!proc.exitValue()) {
        println "Using tag: $lastTag"
    }

    def logCmd = ["git", "log", "${lastTag}..HEAD", "--pretty=format:* %s"]
    def log = new ByteArrayOutputStream()
    exec {
        commandLine logCmd
        standardOutput = log
    }
    return log.toString("UTF-8").trim()
}

def validateTokens() {
    def modrinthToken = System.getenv("MODRINTH_TOKEN") ?: project.findProperty("modrinthToken")?.toString()
    def cfToken = System.getenv("CURSEFORGE_TOKEN") ?: project.findProperty("curseforgeToken")?.toString()

    if (modrinthToken == null) {
        throw new GradleException("Missing MODRINTH_TOKEN: set it either as ENV (MODRINTH_TOKEN) or in ~/.gradle/gradle.properties (modrinthToken)")
    }

    if (cfToken == null) {
        throw new GradleException("Missing CURSEFORGE_TOKEN: set it either as ENV (CURSEFORGE_TOKEN) or in ~/.gradle/gradle.properties (curseforgeToken)")
    }

    return [modrinthToken, cfToken]
}

def updateVersionJson() {
    def updateFile = file("versions.json")
    def currentVersion = mod_version
    def currentMcVersion = minecraft_version

    def jsonContent
    if (updateFile.exists()) {
        jsonContent = new groovy.json.JsonSlurper().parseText(updateFile.text)
    } else {
        jsonContent = [
                "homepage": "https://www.curseforge.com/members/xxrexraptorxx/projects",
                "promos": [:]
        ]
    }

    // Update mod version
    def latestKey = "${currentMcVersion}-latest"
    def recommendedKey = "${currentMcVersion}-recommended"

    jsonContent.promos[latestKey] = currentVersion
    jsonContent.promos[recommendedKey] = currentVersion

    // Update versions.json
    def jsonBuilder = new groovy.json.JsonBuilder(jsonContent)
    updateFile.text = jsonBuilder.toPrettyString()

    println "Updated versions.json:"
    println "  ${latestKey}: ${currentVersion}"
    println "  ${recommendedKey}: ${currentVersion}"
}

// ========================================
// CHANGELOG TASKS
// ========================================

tasks.register('printVersion') {
    group = "changelog"
    description = "Shows the actual mod version"
    doLast { println mod_version }
}

tasks.register("resetChangelog") {
    group = "changelog"
    description = "Resets the changelog"
    doLast {
        def changelogFiles = [file("CHANGELOG.md")]
        changelogFiles.each { f ->
            if (f.exists()) {
                f.delete()
                println "Reset completed: ${f.name}"
            } else {
                println "File not found: ${f.name}"
            }
        }
    }
}

tasks.register("resetLatestChangelog") {
    group = "changelog"
    description = "Resets the latest changelog"
    doLast {
        def changelogFiles = [file("CHANGELOG_LATEST.md")]
        changelogFiles.each { f ->
            if (f.exists()) {
                f.delete()
                println "Reset completed: ${f.name}"
            } else {
                println "File not found: ${f.name}"
            }
        }
    }
}

tasks.register("showLatestChangelog") {
    group = "changelog"
    description = "Shows the latest changelog that will be used for publishing"
    doLast {
        def latestChangelog = generateLatestChangelog()
        println "=== LATEST CHANGELOG ==="
        println latestChangelog
        println "========================"
    }
}

tasks.register("cleanupDuplicateHeaders") {
    group = "changelog"
    description = "Removes duplicate headers from CHANGELOG.md"
    doLast {
        def changelogFile = file("CHANGELOG.md")
        if (!changelogFile.exists()) {
            println "CHANGELOG.md not found"
            return
        }

        // Create backup
        def timestamp = new Date().format('yyyyMMdd_HHmmss')
        def backupFile = file("CHANGELOG_BACKUP_${timestamp}.md")
        changelogFile.renameTo(backupFile)
        println "Backup created: ${backupFile.name}"

        // Remove duplicates
        def lines = backupFile.readLines()
        def cleanedLines = []
        def seenVersions = new HashSet()
        def skipUntilNextVersion = false

        lines.each { line ->
            def versionMatch = line =~ /^# v\.(\d+\.\d+\.\d+) for MC ([\d\.]+)/
            if (versionMatch) {
                def versionKey = "${versionMatch[0][1]}_${versionMatch[0][2]}"

                if (seenVersions.contains(versionKey)) {
                    skipUntilNextVersion = true
                    println "Skipping duplicate version: ${line}"
                } else {
                    seenVersions.add(versionKey)
                    skipUntilNextVersion = false
                    cleanedLines.add(line)
                }
            } else if (line.startsWith("# v.")) {
                skipUntilNextVersion = false
                cleanedLines.add(line)
            } else if (!skipUntilNextVersion) {
                cleanedLines.add(line)
            }
        }

        // Clean up excessive empty lines
        def finalLines = []
        def emptyLineCount = 0

        cleanedLines.each { line ->
            if (line.trim().isEmpty()) {
                emptyLineCount++
                if (emptyLineCount <= 2) {
                    finalLines.add(line)
                }
            } else {
                emptyLineCount = 0
                finalLines.add(line)
            }
        }

        changelogFile.text = finalLines.join('\n')
        println "Cleanup completed!"
    }
}

tasks.register("validateChangelog") {
    group = "changelog"
    description = "Validates CHANGELOG.md for duplicate headers"
    doLast {
        def changelogFile = file("CHANGELOG.md")
        if (!changelogFile.exists()) {
            println "CHANGELOG.md not found"
            return
        }

        def lines = changelogFile.readLines()
        def versions = [:]
        def duplicates = []

        lines.each { line ->
            def versionMatch = line =~ /^# v\.(\d+\.\d+\.\d+) for MC ([\d\.]+)/
            if (versionMatch) {
                def versionKey = "${versionMatch[0][1]}_${versionMatch[0][2]}"
                if (versions.containsKey(versionKey)) {
                    duplicates.add("${versionMatch[0][1]} for MC ${versionMatch[0][2]}")
                    versions[versionKey]++
                } else {
                    versions[versionKey] = 1
                }
            }
        }

        println "=== CHANGELOG VALIDATION ==="
        if (duplicates.isEmpty()) {
            println "✓ No duplicate headers found"
        } else {
            println "❌ Found duplicate headers:"
            duplicates.each { duplicate -> println "  - ${duplicate}" }
            println "\nRun 'gradle cleanupDuplicateHeaders' to fix"
        }

        println "\nFound versions:"
        versions.each { version, count ->
            def status = count > 1 ? "❌ (${count}x)" : "✓"
            println "  ${status} ${version.replace('_', ' for MC ')}"
        }
    }
}

tasks.register("previewChangelogCleanup") {
    group = "changelog"
    description = "Preview what cleanupDuplicateHeaders would do without making changes"
    doLast {
        def changelogFile = file("CHANGELOG.md")
        if (!changelogFile.exists()) {
            println "CHANGELOG.md not found"
            return
        }

        def lines = changelogFile.readLines()
        def seenVersions = new HashSet()
        def duplicateLines = []
        def keptLines = []

        lines.eachWithIndex { line, index ->
            def versionMatch = line =~ /^# v\.(\d+\.\d+\.\d+) for MC ([\d\.]+)/
            if (versionMatch) {
                def versionKey = "${versionMatch[0][1]}_${versionMatch[0][2]}"

                if (seenVersions.contains(versionKey)) {
                    duplicateLines.add("Line ${index + 1}: ${line}")
                } else {
                    seenVersions.add(versionKey)
                    keptLines.add("Line ${index + 1}: ${line}")
                }
            }
        }

        println "=== CLEANUP PREVIEW ==="
        println "\n✓ Headers to KEEP:"
        keptLines.each { println "  ${it}" }

        println "\n❌ Headers to REMOVE:"
        if (duplicateLines.isEmpty()) {
            println "  None found"
        } else {
            duplicateLines.each { println "  ${it}" }
        }

        println "\nRun 'gradle cleanupDuplicateHeaders' to apply these changes"
    }
}

// ========================================
// VERSIONING TASKS
// ========================================

tasks.register("updateVersionFile") {
    group = "versioning"
    description = "Updates the versions.json file with current version"
    doLast { updateVersionJson() }
}

tasks.register("syncVersionFile") {
    group = "versioning"
    description = "Sync versions.json from main branch to current branch"
    doLast {
        try {
            def mainBranch = "main"
            def proc = "git rev-parse --verify main".execute()
            if (proc.waitFor() != 0) {
                proc = "git rev-parse --verify master".execute()
                if (proc.waitFor() == 0) {
                    mainBranch = "master"
                } else {
                    throw new GradleException("Neither 'main' nor 'master' branch found")
                }
            }

            proc = "git cat-file -e ${mainBranch}:versions.json".execute()
            if (proc.waitFor() == 0) {
                proc = "git show ${mainBranch}:versions.json".execute()
                def content = proc.text
                file("versions.json").text = content
                println "Successfully synced versions.json from ${mainBranch} branch"
            } else {
                println "Warning: versions.json not found in ${mainBranch} branch"
            }
        } catch (Exception e) {
            throw new GradleException("Failed to sync versions.json: ${e.message}")
        }
    }
}

// ========================================
// PLATFORM PUBLISHING
// ========================================

// Modrinth Configuration
def rawGameVersions = project.findProperty("game_versions")?.toString() ?: ""
def parsedGameVersions = rawGameVersions.split(",").collect { it.trim() }

modrinth {
    token = System.getenv("MODRINTH_TOKEN") ?: project.findProperty("modrinthToken")?.toString()
    projectId = mr_id
    versionType = release_type
    uploadFile = jar
    loaders = ["neoforge"]
    gameVersions = parsedGameVersions
    changelog = generateLatestChangelog()
    failSilently = true
    syncBodyFrom = rootProject.file("PROJECT_PAGE.md").text
    dependencies {
        // Add dependencies here as needed
    }
}

// CurseForge Configuration
task publishCurseForge(type: TaskPublishCurseForge) {
    def tokens = validateTokens()
    apiToken = tokens[1] // CurseForge token

    def mainFile = upload(project.findProperty("cf_id") as Integer, jar)
    mainFile.displayName = "${mod_name.replace(' ', '')} v.${mod_version}-${mod_loader}"
    mainFile.releaseType = release_type
    mainFile.changelog = generateLatestChangelog()
    mainFile.changelogType = 'markdown'
    mainFile.addModLoader('NeoForge')
    mainFile.addGameVersion(parsedGameVersions)
    mainFile.addJavaVersion(java_version)
    mainFile.addEnvironment()
    environment_type.split(',').each { env ->
        mainFile.addEnvironment(env.trim())
    }
}

// ========================================
// PUBLISHING TASKS
// ========================================

tasks.register("#publishNewVersion") {
    group = "publishing"
    description = "Publish to both Modrinth and CurseForge"

    dependsOn "build", "modrinth", "publishCurseForge"

    doFirst { updateVersionJson() }

    doLast {
        println "=== Publish Completed ==="
        println "Mod Version: ${mod_version}"
        println "Minecraft Version: ${minecraft_version}"
        println "Published to Modrinth and CurseForge"
        println "Updated versions.json with current version"
    }
}

tasks.register("#publishModrinthOnly") {
    group = "publishing"
    description = "Publish only to Modrinth"

    dependsOn "build", "modrinth"

    doFirst { updateVersionJson() }

    doLast {
        println "=== Modrinth Publish Completed ==="
        println "Mod Version: ${mod_version}"
        println "Published to Modrinth only"
        println "Updated versions.json with current version"
    }
}

tasks.register("#publishCurseForgeOnly") {
    group = "publishing"
    description = "Publish only to CurseForge"

    dependsOn "build", "publishCurseForge"

    doFirst { updateVersionJson() }

    doLast {
        println "=== CurseForge Publish Completed ==="
        println "Mod Version: ${mod_version}"
        println "Published to CurseForge only"
        println "Updated versions.json with current version"
    }
}

tasks.register("#generateAndPublish") {
    group = "publishing"
    description = "Generate changelog and publish to both platforms"

    dependsOn "build", "modrinth", "publishCurseForge"

    doFirst {
        // Changelog generation
        try {
            def proc = "conventional-changelog --preset angular --release-count 1".execute()
            proc.waitFor()
            if (proc.exitValue() == 0) {
                def changelogContent = proc.text.trim()
                def changelogFile = file("CHANGELOG_LATEST.md")

                def version = mod_version
                def mcVersion = minecraft_version
                def date = new Date().format('dd.MM.yyyy')
                def header = "# v.${version} for MC ${mcVersion} – ${date}"

                changelogFile.text = "${header}\n${changelogContent}"
                println "Generated CHANGELOG_LATEST.md"
            }
        } catch (Exception e) {
            println "Warning: Could not generate changelog automatically - ${e.message}"
            println "Please ensure conventional-changelog is installed: npm install -g conventional-changelog-cli"
        }

        updateVersionJson()
    }

    doLast {
        println "=== Generate and Publish Completed ==="
        println "Generated changelog and published to both platforms"
        println "Updated versions.json with current version"
    }
}

tasks.register("#dryRunPublish") {
    group = "publishing"
    description = "Dry run - shows what would be published without actually publishing"

    doLast {
        println "=== DRY RUN - PUBLISH PREVIEW ==="
        println "Mod ID: ${mod_id}"
        println "Mod Name: ${mod_name}"
        println "Mod Version: ${mod_version}"
        println "Minecraft Version: ${minecraft_version}"
        println "Release Type: ${release_type}"
        println "Game Versions: ${project.findProperty("game_versions")}"
        println ""
        println "Modrinth Project ID: ${mr_id}"
        println "CurseForge Project ID: ${project.findProperty("cf_id")}"
        println ""
        println "JAR File: ${jar.archiveFileName.get()}"
        println "JAR Path: ${jar.destinationDirectory.get()}/${jar.archiveFileName.get()}"
        println ""

        def changelogContent = generateLatestChangelog()
        println "Changelog Preview:"
        println "==================="
        println changelogContent.take(500) + (changelogContent.length() > 500 ? "..." : "")
        println "==================="
        println ""

        println "versions.json changes that would be made:"
        def currentVersion = mod_version
        def currentMcVersion = minecraft_version
        println "  ${currentMcVersion}-latest: ${currentVersion}"
        println "  ${currentMcVersion}-recommended: ${currentVersion}"
        println ""

        println "Environment Variables:"
        println "MODRINTH_TOKEN: ${System.getenv("MODRINTH_TOKEN") ? 'SET' : 'NOT SET'}"
        println "CURSEFORGE_TOKEN: ${System.getenv("CURSEFORGE_TOKEN") ? 'SET' : 'NOT SET'}"
    }
}
