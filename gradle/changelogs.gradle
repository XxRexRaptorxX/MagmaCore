def generateLatestChangelogFile() {
    def changelogFile = rootProject.file("LATEST_CHANGELOG.md")
    def content = buildChangelogContent()

    changelogFile.text = content
    println "Generated LATEST_CHANGELOG.md with ${content.split('\n').size()} lines"
}

def updateChangelogFile() {
    def changelogFile = rootProject.file("LATEST_CHANGELOG.md")
    def currentVersion = project.mod_version
    def shouldRecreate = false

    if (changelogFile.exists()) {
        def existingContent = changelogFile.text
        def versionPattern = /^#\s+(?:\[\s*)?v\.(\S+)\s+for\s+MC/
        def matcher = existingContent =~ versionPattern

        if (matcher.find()) {
            def existingVersion = matcher.group(1)
            if (existingVersion != currentVersion) {
                println "Version changed from ${existingVersion} to ${currentVersion} - recreating changelog"
                shouldRecreate = true
            } else {
                println "Same version ${currentVersion} - updating existing changelog"
            }
        } else {
            println "No version found in existing changelog - recreating"
            shouldRecreate = true
        }
    } else {
        println "LATEST_CHANGELOG.md doesn't exist - creating new one"
        shouldRecreate = true
    }

    if (shouldRecreate) {
        generateLatestChangelogFile()
    } else {
        updateExistingChangelog(changelogFile)
    }
}

def updateExistingChangelog(File changelogFile) {
    def existingContent = changelogFile.text
    def newContent = buildChangelogContent()

    // Extract commits from both old and new content to merge them
    def existingCommits = extractCommitsFromChangelog(existingContent)
    def newCommits = getCommitsSinceLastTag()

    // Merge and deduplicate commits
    def allCommits = mergeAndDeduplicateCommits(existingCommits, newCommits)

    // Rebuild changelog with merged commits
    def mergedContent = buildChangelogFromCommits(allCommits)
    changelogFile.text = mergedContent

    println "Updated LATEST_CHANGELOG.md - merged ${newCommits.size()} new commits"
}

def buildChangelogContent() {
    //get commits
    def commits = getCommitsSinceLastTag()

    //build changelog
    return buildChangelogFromCommits(commits)
}

def getNextRCNumber(String baseVersion) {
    try {
        def stdout = new ByteArrayOutputStream()
        exec {
            commandLine 'git', 'tag', '--list', "v.${baseVersion}-RC*"
            standardOutput = stdout
            ignoreExitValue = true
        }

        def existingRCTags = stdout.toString().trim().split('\n').findAll { it.trim() }
        def maxRC = 0

        existingRCTags.each { tag ->
            def rcMatch = tag =~ /v\.${baseVersion.replaceAll(/[.*+?^${}()|[\]\\]/, '\\\\$0')}-RC(\d+)/
            if (rcMatch) {
                def rcNum = Integer.parseInt(rcMatch[0][1])
                if (rcNum > maxRC) {
                    maxRC = rcNum
                }
            }
        }

        return maxRC + 1
    } catch (Exception e) {
        println "Error getting next RC number, defaulting to 1: ${e.message}"
        return 1
    }
}

def createAndPushReleaseCandidate() {
    def currentVersion = project.mod_version
    def rcNumber = getNextRCNumber(currentVersion)
    def rcTag = "v.${currentVersion}-RC${rcNumber}"

    try {
        // Create the RC tag
        println "Creating RC tag ${rcTag}..."
        exec {
            commandLine 'git', 'tag', '-a', rcTag, '-m', "Release Candidate ${rcNumber} for version ${currentVersion}"
        }

        // Push the tag
        println "Pushing RC tag ${rcTag} to remote..."
        exec {
            commandLine 'git', 'push', 'origin', rcTag
        }

        println "Successfully created and pushed RC tag: ${rcTag}"
        return rcTag
    } catch (Exception e) {
        throw new GradleException("Failed to create or push RC tag: ${e.message}")
    }
}

def createAndPushReleaseTag() {
    def currentVersion = project.mod_version
    def releaseTag = "v.${currentVersion}"

    try {
        // Check if release tag already exists
        def stdout = new ByteArrayOutputStream()
        exec {
            commandLine 'git', 'rev-parse', '--verify', releaseTag
            standardOutput = stdout
            ignoreExitValue = true
        }

        if (stdout.toString().trim()) {
            println "Release tag ${releaseTag} already exists, skipping creation"
            return releaseTag
        }

        // Create the release tag
        println "Creating release tag ${releaseTag}..."
        exec {
            commandLine 'git', 'tag', '-a', releaseTag, '-m', "Release version ${currentVersion}"
        }

        // Push the tag
        println "Pushing release tag ${releaseTag} to remote..."
        exec {
            commandLine 'git', 'push', 'origin', releaseTag
        }

        println "Successfully created and pushed release tag: ${releaseTag}"
        return releaseTag
    } catch (Exception e) {
        throw new GradleException("Failed to create or push release tag: ${e.message}")
    }
}

def buildChangelogFromCommits(List commits) {
    def currentVersion = project.mod_version
    def gameVersions = project.findProperty("game_versions") ?: minecraft_version
    def dateFormat = new SimpleDateFormat("yyyy-MM-dd")
    def currentDate = dateFormat.format(new Date())

    def content = new StringBuilder()
    def versionLink = getVersionLink(currentVersion)
    if (versionLink) {
        def (label, url) = versionLink
        content.append("# [v.${currentVersion} for MC ${gameVersions}](${url})\n\n")
    } else {
        content.append("# v.${currentVersion} for MC ${gameVersions}\n\n")
    }

    if (commits.isEmpty()) {
        content.append("No commits found for this version.\n")
        return content.toString()
    }

    // Group commits by type
    def groupedCommits = [:]
    def breakingChanges = []

    commits.each { commit ->
        def parsed = parseConventionalCommit(commit.message)
        def type = parsed.type ?: 'other'

        // Skip if commit type is excluded
        if (EXCLUDED_TYPES.contains(type)) {
            return
        }

        if (!groupedCommits.containsKey(type)) {
            groupedCommits[type] = []
        }

        groupedCommits[type].add([
                hash: commit.hash,
                subject: parsed.subject,
                scope: parsed.scope,
                body: parsed.body,
                breaking: parsed.breaking,
                originalMessage: commit.message
        ])

        if (parsed.breaking) {
            breakingChanges.add([
                    subject: parsed.subject,
                    body: parsed.body,
                    scope: parsed.scope
            ])
        }
    }

    // Add breaking changes section first
    if (!breakingChanges.isEmpty()) {
        content.append("## ⚠️ Breaking Changes\n\n")
        breakingChanges.each { change ->
            def scopeText = change.scope ? "(${change.scope}) " : ""
            content.append("- ${scopeText}${change.subject}\n")
            if (change.body) {
                content.append("  ${change.body}\n")
            }
        }
        content.append("\n")
    }

    // Add sections for each commit type (in order of importance)
    def orderedTypes = ['feat', 'fix', 'perf', 'refactor', 'docs', 'style', 'test', 'build', 'ci', 'chore', 'revert', 'other']

    orderedTypes.each { type ->
        if (groupedCommits.containsKey(type)) {
            def displayName = COMMIT_TYPES[type] ?: type.capitalize()
            def emoji = getEmojiForType(type)

            content.append("## ${emoji} ${displayName}\n\n")

            groupedCommits[type].each { commit ->
                def scopeText = commit.scope ? "(${commit.scope}) " : ""
                def breakingIcon = commit.breaking ? " ⚠️" : ""
                def shortHash = commit.hash.substring(0,7)
                content.append("- ${scopeText}${commit.subject} ([${shortHash}](${GITHUB_REPO}/commit/${commit.hash}))${breakingIcon}\n")
            }

            content.append("\n")
        }
    }

    return content.toString()
}

def getGithubRepoUrl() {
    try {
        def stdout = new ByteArrayOutputStream()
        exec {
            commandLine 'git', 'remote', 'get-url', 'origin'
            standardOutput = stdout
            ignoreExitValue = true
        }
        def url = stdout.toString().trim()
        if (!url) return null

        // HTTPS format
        if (url.startsWith('git@')) {
            // git@github.com:USER/REPO.git -> https://github.com/USER/REPO
            url = url.replaceFirst(/^git@([^:]+):/, 'https://$1/')
        }
        url = url.replaceAll(/\.git$/, '')
        return url
    } catch (Exception e) {
        println "Could not detect GitHub repo URL: ${e.message}"
        return null
    }
}
ext.GITHUB_REPO = getGithubRepoUrl()
def GITHUB_REPO = ext.GITHUB_REPO

def getExistingTags() {
    try {
        def proc = ['git', 'tag', '--list'].execute()
        proc.waitFor()
        if (proc.exitValue() != 0) {
            throw new GradleException("Cannot get Git-Tags")
        }
        return proc.in.text.readLines().collect { it.trim() }.findAll { it }
    } catch (Exception e) {
        logger.warn("Error: Cannot get Git-Tags: ${e.message}")
        return []
    }
}

def getCommitsSinceLastTag() {
    try {
        def out = new StringBuffer()
        def err = new StringBuffer()

        // Try to get the last tag (including RC tags)
        def describeCmd = ["git", "--no-pager", "describe", "--tags", "--abbrev=0"]
        def proc = describeCmd.execute()
        proc.consumeProcessOutput(out, err)
        if (!proc.waitFor(10, TimeUnit.SECONDS)) {
            proc.destroyForcibly()
            println "git describe timed out"
            // fall back to full log
        }

        def gitCommand
        if (proc.exitValue() == 0 && out.toString().trim()) {
            def lastTag = out.toString().trim()
            println "Getting commits since last tag: ${lastTag}"
            gitCommand = ["git", "--no-pager", "log", "${lastTag}..HEAD", "--pretty=format:%H|%s|%b", "--no-merges"]
        } else {
            // No tag found -> full history
            println "No previous tag found, getting full commit history"
            gitCommand = ["git", "--no-pager", "log", "--pretty=format:%H|%s|%b", "--no-merges"]
        }

        out = new StringBuffer()
        err = new StringBuffer()
        proc = gitCommand.execute()
        proc.consumeProcessOutput(out, err)

        if (!proc.waitFor(60, TimeUnit.SECONDS)) {
            proc.destroyForcibly()
            println "git log timed out"
            return []
        }

        if (proc.exitValue() != 0) {
            println "Git command failed: ${err.toString()}"
            return []
        }

        def commits = []
        out.toString().readLines().each { line ->
            if (line.trim()) {
                def parts = line.split('\\|', 3)
                if (parts.length >= 2) {
                    commits.add([
                            hash: parts[0],
                            message: parts[1],
                            body: parts.length > 2 ? parts[2] : ""
                    ])
                }
            }
        }

        println "Found ${commits.size()} commits since last tag"
        return commits
    } catch (Exception e) {
        println "Error getting git commits: ${e.message}"
        return []
    }
}

def getLastTag() {
    try {
        def stdout = new ByteArrayOutputStream()
        exec {
            commandLine 'git', 'describe', '--tags', '--abbrev=0'
            standardOutput = stdout
            ignoreExitValue = true
        }
        def tag = stdout.toString().trim()
        return tag ?: null
    } catch (Exception e) {
        println "Could not detect last Git tag: ${e.message}"
        return null
    }
}

def getVersionLink(String currentVersion) {
    def lastTag = getLastTag()
    def currentTag = "v.${currentVersion}"

    if (!GITHUB_REPO) return null

    if (lastTag && lastTag != currentTag) {
        // get diff-link
        return [ "diff", "${GITHUB_REPO}/compare/${lastTag}...${currentTag}" ]
    } else {
        // Fallback if there's no previous tag: get tag-link
        return [ "tag", "${GITHUB_REPO}/releases/tag/${currentTag}" ]
    }
}

def parseConventionalCommit(String message) {
    if (!message) {
        return [type: null, scope: null, subject: "", body: "", breaking: false]
    }
    def msgLines = message.split('\n')
    def header = msgLines[0].trim()
    def body = (msgLines.size() > 1) ? msgLines[1..-1].join('\n').trim() : ""
    def type = null
    def scope = null
    def subject = header
    def breaking = false

    // Match header: type(scope)!: subject  or type!: subject  or type(scope): subject  or type: subject
    def matcher = header =~ /^([A-Za-z0-9_-]+)(?:\(([^)]+)\))?(!)?:\s*(.+)$/
    if (matcher) {
        type = matcher[0][1]
        scope = matcher[0][2]
        def excl = matcher[0][3]
        subject = matcher[0][4]
        if (excl == '!') {
            breaking = true
        }
    } else {
        // fallback: try to split by colon
        def idx = header.indexOf(':')
        if (idx > 0) {
            type = header.substring(0, idx).trim()
            subject = header.substring(idx+1).trim()
        } else {
            subject = header
        }
    }

    // detect breaking change keywords in body (case-insensitive)
    def bk = project.findProperty('BREAKING_CHANGE_KEYWORDS') ?: ['BREAKING CHANGE', 'BREAKING-CHANGE', 'BREAKING_CHANGE']
    bk.each { kw ->
        if (body?.toLowerCase()?.contains(kw.toLowerCase())) {
            breaking = true
        }
    }

    return [type: type, scope: scope, subject: subject, body: body, breaking: breaking]
}

def getEmojiForType(String type) {
    def emojis = [
            'feat': '✨',
            'fix': '🔧',
            'docs': '📚',
            'style': '💎',
            'refactor': '🔨',
            'perf': '🚀',
            'test': '🧪',
            'build': '🛠️',
            'ci': '⚙️',
            'chore': '🧹',
            'revert': '⏪',
            'other': '📝'
    ]
    return emojis[type] ?: '📝'
}

def extractCommitsFromChangelog(String content) {
    // Simple extraction - in a real implementation, this would be more sophisticated
    def commits = []
    def lines = content.split('\n')

    lines.each { line ->
        if (line.startsWith('- ')) {
            // Extract commit info from changelog line
            def commitText = line.substring(2).trim()
            commits.add([
                    subject: commitText,
                    type: 'other' // We'd need to infer this from the section
            ])
        }
    }

    return commits
}

def mergeAndDeduplicateCommits(List existingCommits, List newCommits) {
    def allCommits = []
    def seenSubjects = [] as Set

    // Add new commits first (they're more recent)
    newCommits.each { commit ->
        if (!seenSubjects.contains(commit.message)) {
            allCommits.add(commit)
            seenSubjects.add(commit.message)
        }
    }

    // Add existing commits that weren't duplicated
    existingCommits.each { commit ->
        if (!seenSubjects.contains(commit.subject)) {
            allCommits.add([
                    hash: "existing",
                    message: commit.subject,
                    body: ""
            ])
            seenSubjects.add(commit.subject)
        }
    }

    return allCommits
}

