def setupPreCommitHook() {
    def hookFile = file(".git/hooks/pre-commit")
    def hookScript = generatePreCommitHookScript()

    // Create .git/hooks directory if it doesn't exist
    hookFile.parentFile.mkdirs()

    // Write the hook script
    hookFile.text = hookScript

    // Make it executable (Unix/Linux/Mac)
    if (!System.getProperty("os.name").toLowerCase().contains("windows")) {
        exec {
            commandLine 'chmod', '+x', hookFile.absolutePath
        }
    }

    println "✅ Pre-commit hook installed at: ${hookFile.absolutePath}"
    println "🔄 Every commit will now automatically get an RC tag and be pushed"

    // Also create a post-commit hook for pushing tags
    def postCommitHook = file(".git/hooks/post-commit")
    def postCommitScript = generatePostCommitHookScript()
    postCommitHook.text = postCommitScript

    if (!System.getProperty("os.name").toLowerCase().contains("windows")) {
        exec {
            commandLine 'chmod', '+x', postCommitHook.absolutePath
        }
    }

    println "✅ Post-commit hook installed for automatic tag pushing"
}

def generatePreCommitHookScript() {
    def currentVersion = project.mod_version
    def projectDir = projectDir.absolutePath

    return """#!/bin/sh
# Auto-generated pre-commit hook for RC tagging
# This hook will be executed before every commit

echo "🏷️  Preparing RC tag for commit..."

# Get the project directory
PROJECT_DIR="${projectDir}"

# Change to project directory
cd "\$PROJECT_DIR"

# Get current version from gradle.properties or build.gradle
CURRENT_VERSION="${currentVersion}"

echo "📋 Current version: \$CURRENT_VERSION"

# The actual RC tagging will happen in post-commit to avoid issues
# Pre-commit just validates that we can create tags
exit 0
"""
}

def generatePostCommitHookScript() {
    def currentVersion = project.mod_version
    def projectDir = projectDir.absolutePath

    return """#!/bin/sh
# Auto-generated post-commit hook for RC tagging and pushing
# This hook will be executed after every commit

echo "🏷️  Creating RC tag for new commit..."

# Get the project directory
PROJECT_DIR="${projectDir}"

# Change to project directory
cd "\$PROJECT_DIR"

# Get current version
CURRENT_VERSION="${currentVersion}"

# Get next RC number by checking existing RC tags
RC_TAGS=\$(git tag -l "v.\$CURRENT_VERSION-RC*" | wc -l)
NEXT_RC=\$((RC_TAGS + 1))
RC_TAG="v.\$CURRENT_VERSION-RC\$NEXT_RC"

echo "🔖 Creating tag: \$RC_TAG"

# Create the RC tag on the latest commit
git tag -a "\$RC_TAG" -m "Auto-generated RC tag \$NEXT_RC for version \$CURRENT_VERSION"

# Push the tag to remote
echo "⬆️  Pushing tag to remote..."
git push origin "\$RC_TAG"

if [ \$? -eq 0 ]; then
    echo "✅ Successfully created and pushed RC tag: \$RC_TAG"
else
    echo "❌ Failed to push RC tag: \$RC_TAG"
fi

# Also update the changelog
echo "📝 Updating changelog..."
cd "\$PROJECT_DIR"
./gradlew updateChangelog -q

echo "🎉 RC tagging complete!"
"""
}

