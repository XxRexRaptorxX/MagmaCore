tasks.register('checkGradleProperties') {
    group = 'verification'
    description = 'Check gradle.properties for required keys and optionally add missing ones.'

    doLast {
        def propsFile = rootProject.file('gradle.properties')
        def props = new Properties()
        if (propsFile.exists()) {
            propsFile.withInputStream { stream -> props.load(stream) }
        } else {
            println "No gradle.properties found — a new one will be created if you choose to add properties."
        }

        def missing = requiredProps.keySet().findAll { !props.containsKey(it) }
        if (missing.isEmpty()) {
            println "✅ All required properties are present."
            return
        }

        println "Missing properties: ${missing.join(', ')}"

        def nonInteractive = project.hasProperty('nonInteractive')
        def stdin = new BufferedReader(new InputStreamReader(System.in))

        def askLine = { prompt ->
            try {
                if (System.console()) {
                    System.console().readLine(prompt)
                } else {
                    print prompt
                    stdin.readLine()
                }
            } catch (Exception e) {
                null
            }
        }

        def addAll
        if (nonInteractive) {
            println "nonInteractive: missing properties will be added with defaults."
            addAll = true
        } else {
            def ans = askLine("Add all missing properties? (y/n) ") ?: "n"
            addAll = ans.trim().toLowerCase().startsWith('y')
        }

        if (!addAll) {
            println "No changes made."
            return
        }

        missing.each { key ->
            def defaultVal = requiredProps[key]
            def value
            if (nonInteractive) {
                value = defaultVal
            } else {
                def prompt = "Value for '${key}' (press Enter to use default '${defaultVal}'): "
                def v = askLine(prompt)
                value = (v == null || v.trim() == '') ? defaultVal : v
            }
            props.setProperty(key, value)
            println "-> set: ${key}=${value}"
        }

        propsFile.withOutputStream { out -> props.store(out, "Automatically updated by task checkGradleProperties") }
        println "✅ gradle.properties updated: ${propsFile.absolutePath}"
    }
}

tasks.register('setupGitattributes') {
    group = "initialization"
    description = "Creates or updates .gitattributes for the project to fix some Spotless-Git problems"
    doLast {
        def gitattributes = file(".gitattributes")
        def requiredLines = [
                '*.java text eol=lf',
                '*.gradle text eol=lf',
                '*.md text eol=lf',
                '*.yml text eol=lf',
                '*.yaml text eol=lf'
        ]

        if (!gitattributes.exists()) {
            gitattributes.text = requiredLines.join("\n") + "\n"
            println "✅ Created .gitattributes"
        } else {
            // check lines
            def existingLines = gitattributes.readLines().collect { it.trim() }
            def linesToAdd = requiredLines.findAll { !existingLines.contains(it) }

            if (linesToAdd) {
                gitattributes.append("\n" + linesToAdd.join("\n") + "\n")
                println "✅ Added missing lines to .gitattributes"
            } else {
                println "✅ .gitattributes already contains all required lines"
            }
        }
    }
}


tasks.register('createPreCommitHook') {
    group = "initialization"
    description = "Creates a Git pre-commit hook"
    doLast {
        def hookDir = file(".githooks")
        hookDir.mkdirs()
        def hook = new File(hookDir, "pre-commit")
        hook.text = """#!/bin/sh
./gradlew updateChangelog
git add LATEST_CHANGELOG.md
"""
        hook.executable = true
        println "✅ Created .githooks/pre-commit"
    }
}


//create or restore CHANGELOG.md / LATEST_CHANGELOG.md
def restoreOrCreateFile = { fileName, envVar ->
    def f = file(fileName)
    if (!f.exists()) {
        try {
            exec {
                commandLine 'git', 'show', "HEAD:./$fileName"
                standardOutput = new FileOutputStream(f)
                isIgnoreExitValue = true
            }
            println "✅ Restored $fileName from git HEAD"
            exec { commandLine 'git', 'add', fileName }
        } catch (Exception e) {
            def createFlag = System.getenv(envVar) ?: "Y"
            if (createFlag.toUpperCase() in ["Y", "YES", "1"]) {
                f.text = ""
                exec { commandLine 'git', 'add', fileName }
                println "✅ Created $fileName"
            } else {
                throw new GradleException("❌ $fileName missing. Set $envVar=1 to auto-create.")
            }
        }
    }
}

tasks.register('setupChangelogs') {
    group = "initialization"
    description = "Creates or restores CHANGELOG.md and LATEST_CHANGELOG.md"
    doLast {
        restoreOrCreateFile("LATEST_CHANGELOG.md", "CREATE_LATEST_CHANGELOG")
        restoreOrCreateFile("CHANGELOG.md", "CREATE_CHANGELOG")
    }
}

tasks.register('setupVersionsJson') {
    group = "initialization"
    description = "Creates versions.json if it does not exist"
    doLast {
        def versionsFile = file("versions.json")
        if (!versionsFile.exists()) {
            def modVersion = project.findProperty("mod_version") ?: "1.0.0"
            def mcVersion = project.findProperty("minecraft_version") ?: "1.20.1"
            def json = [
                    homepage: "https://www.curseforge.com/members/xxrexraptorxx/projects",
                    promos: [( "${mcVersion}-latest" ): mcVersion, ( "${mcVersion}" ): modVersion]
            ]
            versionsFile.text = JsonOutput.prettyPrint(JsonOutput.toJson(json))
            exec { commandLine 'git', 'add', 'versions.json' }
            println "✅ Created versions.json"
        } else {
            println "✅ versions.json already exists"
        }
    }
}

tasks.register('createGitTag') {
    group = "initialization"
    description = "Creates and pushes a git tag based on mod_version"
    doLast {
        def modVersion = project.findProperty("mod_version") ?: "1.0.0"
        def tagName = "v.$modVersion"
        def result = exec {
            commandLine 'git', 'rev-parse', tagName
            isIgnoreExitValue = true
        }
        if (result.exitValue != 0) {
            exec { commandLine 'git', 'tag', tagName }
            exec { commandLine 'git', 'push', 'origin', tagName }
            println "🏷️ Created and pushed git tag $tagName"
        } else {
            println "✅ Git tag $tagName already exists"
        }
    }
}

